services:
  - type: web
    name: wellbeing-tracker
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: WEB_CONCURRENCY
        value: 4

  - type: web
    name: wellbeing-ai-coach
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn fastapi_app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false